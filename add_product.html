<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product - Trinket Theory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="add">
  <div class="dashboard-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="images/logo.png" alt="Trinket Theory logo" />
        <div>
          <h1>Trinket Theory</h1>
          <p>Admin Dashboard</p>
        </div>
      </div>

      <nav>
        <a href="admin.html">Overview</a>
        <a href="products.html">Products</a>
        <a href="add_product.html" class="active">Add Product</a>
      </nav>

      <div class="sidebar-footer">
        <p>Powered by</p>
        <div class="powered-by">
          <img src="images/mylogo.png" alt="Powered by logo" />
          <span>RJ Tech</span>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <h1>Add Product</h1>
          <p>Enter the product details below to add a new item to the catalog.</p>
        </div>
      </header>

      <div class="container">
        <section class="card">
          <h2>New Product</h2>
          <form id="productForm">
            <div class="form-group">
              <label for="name">Product Name</label>
              <input type="text" id="name" name="name" placeholder="e.g. Gold Pendant" required />
            </div>

            <div class="form-group">
              <label for="price">Price (PKR)</label>
              <input type="number" id="price" name="price" step="0.01" min="0" placeholder="29999" required />
            </div>

            <div class="form-group">
              <label for="image_file">Product Image</label>
              <input type="file" id="image_file" name="image_file" accept="image/*" />
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" name="description" rows="5" placeholder="Describe the product..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Add Product</button>
            <div id="message" class="message"></div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
