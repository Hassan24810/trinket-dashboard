<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - Trinket Theory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="products">
  <div class="dashboard-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="images/logo.png" alt="Trinket Theory logo" />
        <div>
          <h1>Trinket Theory</h1>
          <p>Admin Dashboard</p>
        </div>
      </div>

      <nav>
        <a href="admin.html">Overview</a>
        <a href="products.html" class="active">Products</a>
        <a href="add_product.html">Add Product</a>
      </nav>

      <div class="sidebar-footer">
        <p>Powered by</p>
        <div class="powered-by">
          <img src="images/mylogo.png" alt="Powered by logo" />
          <span>RJ Tech</span>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <h1>Product Catalog</h1>
          <p>All of your products are listed here with the latest additions first.</p>
        </div>
        <button id="refreshBtn" class="secondary-btn">Refresh</button>
      </header>

      <div class="container">
        <section class="card">
          <div class="list-header">
            <div>
              <h2>Products</h2>
              <p>Latest products are shown first.</p>
            </div>
            <div class="product-count">Showing <span id="summaryTotalSmall">0</span> products</div>
          </div>
          <div id="productList" class="product-list">Loading...</div>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
